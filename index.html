<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GÓC NHÀ SỐ 8</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* ===== VIDEO NỀN ===== */
video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* ===== HEADER ===== */
header {
  background: linear-gradient(135deg, #ffc3e8, #c3e7ff);
  color: white;
  padding: 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ===== NAV ===== */
nav {
  background: white;
  padding: 10px;
  text-align: center;
}

nav a {
  color: blue;
  text-decoration: none;
  margin: 0 15px;
  font-weight: bold;
  font-size: 22px;
}

nav a:hover {
  text-decoration: underline;
  background: linear-gradient(90deg,#fff7ad,#ffa9f9);
}

/* ===== BÌA ===== */
.bia {
  height: 70vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.biasach {
  width: 300px;
  height: 400px;
  background: url("https://picsum.photos/400/600?random=10") center/cover;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  cursor: pointer;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  color: white;
  font-size: 24px;
  font-weight: bold;
  padding-bottom: 20px;
  transition: 0.3s;
}

.biasach:hover {
  transform: scale(1.05);
}

/* ===== ALBUM ===== */
.album {
  display: none;
  justify-content: space-between;
  align-items: center;
  padding: 40px 100px;
  color: white;
}

.album img {
  width: 400px;
  height: 250px;
  object-fit: cover;
  border-radius: 15px;
}

.noidung {
  background: rgba(0,0,0,0.6);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

button.album-btn {
  width: 150px;
  height: 60px;
  font-size: 18px;
  border: none;
  border-radius: 15px;
  cursor: pointer;
}
  #vungtoi {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:flex;
    justify-content:center;
    align-items:center
}

#vungtoi img {
    max-width:90%;
    max-height:90%;
    border-radius:10px
}
</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop>
  <source src="anhdong.mp4" type="video/mp4">
</video>

<header>
  <h1><img src="gocnhaso8.png" width="35"> - Góc nhà số 8</h1>
  <div class="search-bar">
    <input type="text" placeholder="Tìm kiếm...">
    <button>🔍</button>
  </div>
</header>

<nav>
  <a href="#"> Trang chủ </a>
  <a href="#"> Danh sách </a>
  <a href="#"> Dòng thời gian </a>
  <a href="https://www.youtube.com/@A8-K59THPT-LTK" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" width="100">
  </a>
  <a href="#">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_(2020).svg" width="30">
  </a>
</nav>

<!-- BÌA -->
<div class="bia" id="bia">
  <div class="biasach" onclick="moAlbum()">Album A8-K59</div>
</div>

<!-- ALBUM -->
<div class="album" id="album">
  <button class="album-btn" onclick="truoc()">⬅ Trước</button>

  <div class="noidung">
    <img id="anh" onclick="moanh()">
    <p id="text"></p>
  </div>

  <button class="album-btn" onclick="sau()">Sau ➡</button>
</div>

<!-- Video -->
<div class="video" id="video"> 
  
</div>
<script>
const pages = [
  {
    img:"https://picsum.photos/600/400?1",
    text:"Trang 1: Cả lớp chụp hình đầu năm."
  },
  {
    img:"https://picsum.photos/600/400?2",
    text:"Trang 2: Tiết sinh hoạt cuối tuần."
  },
  {
    img:"https://picsum.photos/600/400?3",
    text:"Trang 3: Chuyến đi tham quan."
  }
];

let tranghientai = 0;

const bia = document.getElementById("bia");
const album = document.getElementById("album");
const text = document.getElementById("text");
const anh = document.getElementById("anh");

function moAlbum(){
  bia.style.display = "none";
  album.style.display = "flex";
  hientrang();
}

function hientrang(){
  text.innerText = pages[tranghientai].text;
  anh.src = pages[tranghientai].img;
}

function truoc(){
  if(tranghientai > 0){
    tranghientai--;
    hientrang();
  }
}

function sau(){
  if(tranghientai < pages.length - 1){
    tranghientai++;
    hientrang();
  }
}

  function moanh() {
    const div = document.createElement("div")
    div.id = "vungtoi"
    div.innerHTML = "<img src:='"+this.src+"'>"
    document.body.appendChild(div)
    div.onclick = function() {document.body.removeChild(div)}
  }
    
    
  
</script>

</body>
</html>
