<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GÓC NHÀ SỐ 8</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop>
  <source src="anhdong.mp4" type="video/mp4">
</video>

<!-- Phần header -->
<header>
  <h1><img src="gocnhaso8.png" width="35"> - Góc nhà số 8</h1>
  <div class="search-bar">
    <input type="text" placeholder="Tìm kiếm...">
    <button>🔍</button>
  </div>
</header>

<!-- Thanh navbar -->
<nav>
  <a href="#"> Trang chủ </a>
  <a href="#"> Danh sách </a>
  <a href="#"> Dòng thời gian </a>
  <a href="https://www.youtube.com/@A8-K59THPT-LTK" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" width="100">
  </a>
  <a href="#">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_(2020).svg" width="30">
  </a>
</nav>

<!-- BÌA -->
<div class="bia" id="bia">
  <div class="biasach" onclick="moAlbum()">Album A8-K59</div>
</div>

<!-- ALBUM -->
<div class="album" id="album">
  <button class="album-btn" onclick="truoc()">⬅ Trước</button>

  <div class="noidung">
    <img id="anh" onclick="moanh()">
    <p id="text"></p>
  </div>

  <button class="album-btn" onclick="sau()">Sau ➡</button>
</div>

<!-- Clip theo dòng thời gian -->
<div class="clip" id="clip"> 
  
</div>
<script>
const pages = [
  {
    img:"https://picsum.photos/600/400?1",
    text:"Trang 1: Cả lớp chụp hình đầu năm."
  },
  {
    img:"https://picsum.photos/600/400?2",
    text:"Trang 2: Tiết sinh hoạt cuối tuần."
  },
  {
    img:"https://picsum.photos/600/400?3",
    text:"Trang 3: Chuyến đi tham quan."
  }
];

let tranghientai = 0;

const bia = document.getElementById("bia");
const album = document.getElementById("album");
const text = document.getElementById("text");
const anh = document.getElementById("anh");

function moAlbum(){
  bia.style.display = "none";
  album.style.display = "flex";
  hientrang();
}

function hientrang(){
  text.innerText = pages[tranghientai].text;
  anh.src = pages[tranghientai].img;
}

function truoc(){
  if(tranghientai > 0){
    tranghientai--;
    hientrang();
  }
}

function sau(){
  if(tranghientai < pages.length - 1){
    tranghientai++;
    hientrang();
  }
}

  function moanh() {
    const div = document.createElement("div")
    div.id = "vungtoi"
    div.innerHTML = "<img src='"+ anh.src +"'>"
    document.body.appendChild(div)
    div.onclick = function() {document.body.removeChild(div)}
  }
    
    
  
</script>

</body>
</html>
